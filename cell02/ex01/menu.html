<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNCF Sandwich Menu</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>
    <main class="menu">
        <p class="logo">SNCF</p>
        <h1>Sandwich menu</h1>
        <p>Choose your sandwich for the journey.</p>

        <label for="sandwich">Choose an option</label>
        <select id="sandwich" name="sandwich">
            <option value="" selected>-- Select a sandwich --</option>
            <option value="classic">The Classic - Ham and cheese - 6,50 €</option>
            <option value="vegetarian">The Vegetarian - Vegetables and feta - 6,20 €</option>
            <option value="chicken">The Chicken - Chicken and tomatoes - 6,80 €</option>
        </select>
    </main>
</body>
</html>
